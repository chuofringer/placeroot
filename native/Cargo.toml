[package]
name = "placeroot_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Optional compiled kernels for placeroot's street-graph build and Dijkstra search"
license = "MIT"
publish = false

[lib]
name = "placeroot_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 1
