version: 2
# Maintenance cadence (2026-10): one grouped PR per ecosystem per month, so a
# quarterly pass can merge everything in one sitting instead of five PRs a week.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Python deps are locked in uv.lock at the repo root.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  # The npm launcher package (no lockfile; manifest-only updates).
  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
