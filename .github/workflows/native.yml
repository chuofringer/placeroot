name: Native accelerator

# Builds the optional placeroot_native extension (native/) and checks that it
# agrees with the pure-Python routing core. The default CI (ci.yml) never builds
# it; placeroot is pure Python and this job is the only build check.
# Wheels are not published yet; see docs/REFERENCE.md.

on:
  pull_request:
    paths:
      - "native/**"
      - "src/placeroot/routing.py"
      - "src/placeroot/native.py"
      - ".github/workflows/native.yml"
  workflow_dispatch:

# Least privilege: nothing in this job writes to the repo.
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # dtolnay/rust-toolchain HEAD, 2026-10
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Install maturin
        run: uv pip install maturin

      - name: Build placeroot_native (release)
        # --no-sync: a plain `uv run` re-syncs .venv to the lockfile, which
        # removes maturin (installed ad hoc above) and, later, the built
        # placeroot_native module.
        run: uv run --no-sync maturin develop --release -m native/Cargo.toml

      - name: Equivalence tests with the extension present
        run: uv run --no-sync pytest tests/test_native_routing.py -q -p no:cacheprovider -rs

      - name: Timing, Python vs native (200k segments, 50 searches)
        run: uv run --no-sync python native/bench_routing.py --segments 200000 --queries 50 | tee native-timing.txt

      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-timing
          path: native-timing.txt
          if-no-files-found: warn
