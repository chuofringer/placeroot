name: Overture Canary
# Weekly staleness + schema watch on the upstream Overture bucket (#219).
# Fails (and opens/refreshes an issue) when the pinned fallback release is
# no longer upstream's newest, or when the newest release drops a column we
# require. See scripts/overture_canary.py for what exactly is probed.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — offset to dodge cron rushes
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run the canary
        id: canary
        run: |
          set -o pipefail
          uv run python scripts/overture_canary.py | tee canary-report.md

      - name: Open or refresh the canary issue
        if: failure() && steps.canary.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Overture canary: stale pin or schema drift"
          BODY="$(cat canary-report.md 2>/dev/null || echo 'canary failed before producing a report — see the workflow run')"
          BODY="$BODY

Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label bug --body "$BODY"
          fi
