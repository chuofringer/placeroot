name: Prepare Release
# Step 1 of cutting a release (docs/PUBLISHING.md): bump the version
# everywhere it is claimed — pyproject.toml, npm/package.json, uv.lock, and
# the marketing site's version copy — and open the PR.
#
# This exists so the website ships *with* the release instead of trailing it.
# The site's version chip, footer byline and installer note used to be four
# hand edits someone had to remember after tagging; here they are one input
# to one workflow, and the Release workflow refuses to publish if they were
# skipped anyway.
#
# Actions → Prepare Release → Run workflow, then review + merge the PR it
# opens. Merging it deploys the site (deploy-site.yml, on push to main).
#
# NOTE: the PR is pushed and opened with the workflow's GITHUB_TOKEN, and
# GitHub does not trigger on:push/on:pull_request workflows for events that
# token creates — so the release PR carries NO ci.yml checks and no site
# preview. The "Verify the bumped tree" step below (ruff + the full offline
# pytest suite, including the site sync guards) is the verification for that
# PR. If main ever gains required status checks, switch the checkout/push/PR
# steps to a GitHub App or PAT token so CI runs on the PR.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 0.6.0 (no leading v)'
        required: true
        type: string
      highlight:
        description: >-
          Optional free-text for the site's "new in this release" chip. Leave
          blank to derive the tools added since the previous release tag.
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags: bump_version.py derives the new-tool list by
          # diffing the working tree's registered tools against the previous
          # release tag's server.py, which a shallow clone can't see.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Bump version everywhere
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          HIGHLIGHT: ${{ inputs.highlight }}
        run: |
          set -euo pipefail
          if [ -n "$HIGHLIGHT" ]; then
            uv run python scripts/bump_version.py "$VERSION" --highlight "$HIGHLIGHT"
          else
            uv run python scripts/bump_version.py "$VERSION"
          fi
          # placeroot's own version is pinned in uv.lock; refresh it so the PR
          # doesn't land a lock file pointing at the previous version.
          uv lock
          # The site serves the Desktop Extension bundle (#233); rebuild it so
          # the bundle's manifest version matches the bump —
          # tests/test_mcpb_bundle.py fails the verify step below otherwise.
          uv run python scripts/build_mcpb.py site/placeroot.mcpb
          # The bump rewrites version-pinned links in README.md; npm/README.md
          # is generated from it, so re-sync or test_npm_readme_sync fails the
          # verify step (seen cutting 0.9.8).
          uv run python scripts/sync_npm_readme.py

      - name: Verify the bumped tree
        run: |
          set -euo pipefail
          uv run ruff check .
          # The full offline suite: the sync guards prove the site now matches
          # the new version, and the rest proves the bump broke nothing.
          uv run pytest -q

      - name: Push the bump branch
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Release ${VERSION}: bump package + site version"
          git push -u origin "$BRANCH" --force-with-lease
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open the release PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ steps.push.outputs.branch }}
        with:
          script: |
            const version = process.env.VERSION;
            const head = process.env.BRANCH;

            const body = [
              `Prepared by **Prepare Release** for \`v${version}\`.`,
              '',
              'Bumped in one shot by `scripts/bump_version.py`:',
              '- `pyproject.toml` + `npm/package.json` (published as a pair) and `uv.lock`',
              '- `site/index.html` — version chip, footer byline, "new in this release"',
              '- `site/add-to-your-ai.html` — "latest release" note',
              '',
              'Merging deploys the site to production (`deploy-site.yml`).',
              'Then draft the GitHub release for `v' + version + '` — its',
              '`verify` job re-checks that the tag, both package versions and',
              'the site all agree before anything is published.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${version}`,
              head,
              base: 'main',
              body,
            });
            core.notice(`Opened ${pr.html_url}`);
