name: Deploy Site
# Direct-upload the static marketing site (site/) to Cloudflare Pages on every
# push to main that touches it. Same pattern as the sibling funradar/flood
# repos: wrangler pages deploy from CI, authenticated with the account's
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets — no Pages
# Git-integration build (the site is plain HTML, there's nothing to build).
#
# Prerequisites (owner, one-time):
#   - A Cloudflare Pages project exists; its name must match PROJECT below.
#   - Repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
#   - Custom domain placeroot.dev attached to the Pages project in the dashboard.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Serialize deploys so overlapping runs queue instead of racing.
concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  PROJECT: placeroot

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy site/ to Cloudflare Pages
        run: >
          npx --yes wrangler@latest pages deploy site
          --project-name="$PROJECT"
          --branch=main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
