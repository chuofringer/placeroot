name: Regenerate release artifacts
# Runs the pin-bump chore from docs/PIN.md where the public bucket and
# DuckDB's extension host are reachable, and pushes the result to a branch
# for a human to open as a PR (Actions cannot open PRs in this org). Nothing
# here touches main: it commits to `pin-<release>` only.
#
#   bump_pin.py <release>
#   build_release_manifest.py / build_geocode_index.py / build_land_cover_grid.py
#   delete the superseded release's three artifact sets (the mcpb bundle must
#   stay under Cloudflare Pages' 25 MiB file limit; see docs/PIN.md §2a)
#
# Left for the PR author: tests/test_manifest.py's release literal and file
# counts, CHANGELOG, and the docs sweep docs/PIN.md §2c describes.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Overture release to pin, e.g. 2026-10-21.0'
        required: true
      base:
        description: 'Branch to start from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Validate release name
        run: |
          [[ "$RELEASE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]] || { echo "bad release: $RELEASE"; exit 1; }

      - name: Bump the pin
        run: uv run python scripts/bump_pin.py "$RELEASE"

      - name: Build file manifests
        run: uv run python scripts/build_release_manifest.py "$RELEASE"

      - name: Build geocode index
        run: uv run python scripts/build_geocode_index.py "$RELEASE"

      - name: Build land-cover grid
        run: uv run python scripts/build_land_cover_grid.py "$RELEASE"

      - name: Drop superseded artifact sets
        run: |
          set -euo pipefail
          data=src/placeroot/data
          for d in "$data"/manifests/*/ "$data"/geocode-index/*/; do
            name=$(basename "$d")
            if [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ && "$name" != "$RELEASE" ]]; then
              echo "removing $d"; rm -rf "$d"
            fi
          done
          for f in "$data"/land-cover-grid/*.parquet; do
            name=$(basename "$f" .parquet)
            if [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ && "$name" != "$RELEASE" ]]; then
              echo "removing $f"; rm -f "$f"
            fi
          done
          ls -la "$data"/manifests "$data"/geocode-index "$data"/land-cover-grid
          du -sh "$data"

      - name: Commit and push to pin-<release>
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "pin-$RELEASE"
          git add -A src/placeroot/release.py src/placeroot/data
          git status --short | head -50
          git commit \
            -m "Pin Overture release $RELEASE and regenerate bundled artifacts" \
            -m "Generated by the regenerate-artifacts workflow (run ${{ github.run_id }}): bump_pin.py, build_release_manifest.py, build_geocode_index.py, build_land_cover_grid.py; superseded release artifacts removed per docs/PIN.md section 2a."
          git push --force-with-lease origin "pin-$RELEASE"
          echo "branch pin-$RELEASE pushed" >> "$GITHUB_STEP_SUMMARY"
