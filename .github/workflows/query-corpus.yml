name: Query Corpus
# Weekly cold run of benchmarks/query_corpus.py against live Overture data
# (#269): 137 real user questions across every tool and 40+ cities, each in a
# fresh process with an empty cache, each checked for a *correct answer*.
#
# This exists because the per-tool cold matrix it replaces reported every tool
# under 10s while resolve_place("Stanford Shopping Center") took 61s and
# returned nothing, and geocode("Casablanca") answered Chile in 0.2s — which a
# timing-only bench scores as the best result in the suite.
#
# The 20-id 15s question-level gate (cold+warm, --fail-on both) is
# question-gate.yml (#331). This weekly job stays the full corpus.
#
# Gated on correctness only. Latency is reported, never failed on: a hosted
# runner's bandwidth to S3 is not the residential connection the published
# numbers describe, and a flapping weekly job is one nobody reads.
on:
  schedule:
    - cron: '41 5 * * 2'   # Tuesdays 05:41 UTC, a day off the Overture canary
  workflow_dispatch:
    inputs:
      tool:
        description: 'Only this tool family (blank = all 137 queries)'
        required: false

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          # v10 still installs uv if cache is off. schedule/workflow_dispatch
          # are not in the auto-disable list; keep true anyway.
          enable-cache: true

      - name: Run the corpus
        run: |
          set -o pipefail
          uv run python benchmarks/run_query_corpus.py \
            --fail-on wrong \
            --json corpus-results.jsonl \
            ${{ inputs.tool && format('--tool {0}', inputs.tool) || '' }} \
            | tee corpus-report.txt

      # Uploaded whichever way the run went: the timings are the point even
      # when every answer is right, and they are what a release claiming
      # anything about cold start should be read against.
      #
      # upload-artifact v7 runs on Node 24 (ubuntu-latest is fine). Keep
      # archive: true — v7's archive:false path is single-file only and
      # ignores `name`. We upload two files, so they must stay zipped.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: query-corpus-results
          archive: true
          path: |
            corpus-results.jsonl
            corpus-report.txt
