name: Release

on:
  release:
    types: [published]
  # Manual trigger: lets a maintainer re-run the publish without cutting a
  # new release (e.g. after a transient CI/infra failure). Trusted publishing
  # keys on repo + workflow filename + environment, not the event type, so a
  # dispatched run publishes the current pyproject version normally.
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no PyPI token in the repo
      contents: read   # checkout needs this to clone a PRIVATE repo — naming
                       # id-token alone drops every other scope (incl.
                       # contents) to none, which fails checkout on a private
                       # repo with "Repository not found".
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: read  # explicit so checkout works regardless of the repo's
                      # default-token-permission setting (private repo).
    steps:
      - uses: actions/checkout@v4

      - name: Check NPM_TOKEN secret is configured
        id: check_token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret not set — skipping npm publish"
          fi

      - name: Set up Node
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
