name: Release

on:
  release:
    types: [published]
  # Manual trigger: lets a maintainer re-run the publish without cutting a
  # new release (e.g. after a transient CI/infra failure). Trusted publishing
  # keys on repo + workflow filename + environment, not the event type, so a
  # dispatched run publishes the current pyproject version normally.
  workflow_dispatch:

jobs:
  # Gate: a release must not be able to publish past a stale website. The
  # site's version copy and tool list are guarded by tests, but those guards
  # only run on a push/PR — a release tagged without the version bump would
  # otherwise sail straight to PyPI while placeroot.dev still advertised the
  # previous version. Failing here costs a re-tag; failing silently costs a
  # wrong website for as long as nobody notices.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          # v10 auto-disables cache on `release` when enable-cache is auto.
          # Keep true so uv still installs *and* the uv cache is used.
          enable-cache: true

      - name: Package versions agree with the release tag
        env:
          # Empty on workflow_dispatch (no tag to compare against); the
          # pyproject/npm cross-check below still runs.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PY_VERSION=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          NPM_VERSION=$(node -p "require('./npm/package.json').version")
          echo "pyproject=$PY_VERSION npm=$NPM_VERSION tag=${TAG_NAME:-<none>}"

          if [ "$PY_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::pyproject.toml ($PY_VERSION) and npm/package.json ($NPM_VERSION) disagree." >&2
            exit 1
          fi

          if [ -n "${TAG_NAME:-}" ] && [ "${TAG_NAME#v}" != "$PY_VERSION" ]; then
            echo "::error::Release tag $TAG_NAME does not match the package version $PY_VERSION. Run the Prepare Release workflow, merge its PR, then re-tag." >&2
            exit 1
          fi

      - name: Website matches this release
        run: |
          set -euo pipefail
          # Same guards CI runs, re-run here against the tagged tree: every
          # version string on the site equals the package version, and the
          # tool grid matches the tools server.py actually registers.
          uv run pytest tests/test_site_version_sync.py tests/test_site_tools_sync.py tests/test_npm_readme_sync.py -q

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no PyPI token in the repo
      contents: read   # naming id-token alone drops every other scope
                       # (incl. contents) to none, which fails checkout.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          # v10 auto-disables cache on `release` when enable-cache is auto.
          # Keep true so uv still installs *and* the uv cache is used.
          enable-cache: true

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 branch head, 2026-08
        with:
          # Idempotent: if this version is already on PyPI (e.g. a re-run
          # after the npm job failed, or an infra retry), treat it as a
          # no-op success instead of erroring on the duplicate upload — so
          # the npm job below (needs: pypi) can still run.
          skip-existing: true

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    needs: pypi
    # Run whenever pypi didn't hard-fail — including when it was skipped or
    # a no-op — so npm can publish independently of a fresh PyPI upload.
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    permissions:
      contents: read   # checkout
      id-token: write  # npm trusted publishing (OIDC) — no NPM_TOKEN, no 2FA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; setup-node's Node 20 ships an
      # older npm. Upgrade, then publish — auth is via the OIDC token, so there
      # is no token to leak and no one-time-password prompt (which is what
      # blocked the automation-token path, EOTP).
      # Requires a configured trusted publisher on npmjs.com for this repo +
      # workflow; see docs/PUBLISHING.md.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm (trusted publishing)
        working-directory: npm
        run: |
          # Idempotent, mirroring the PyPI job's skip-existing: publish only if
          # this version isn't already on npm, so a re-run of an already-shipped
          # version is a clean no-op instead of a "cannot publish over the
          # previously published version" failure.
          VERSION=$(node -p "require('./package.json').version")
          if npm view "placeroot@${VERSION}" version >/dev/null 2>&1; then
            echo "placeroot@${VERSION} is already on npm — nothing to publish."
          else
            # Provenance attestation requires a PUBLIC source repository —
            # npm rejects the sigstore bundle outright from a private one
            # (E422, hit on v0.9.0 pre-flip). Trusted publishing itself
            # works either way, so a private-repo release publishes without
            # the attestation rather than not at all; once the repo is
            # public, releases pick provenance back up with no edit here.
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "repo is private: publishing without --provenance"
              npm publish --access public
            else
              npm publish --access public --provenance
            fi
          fi

  # The Desktop Extension bundle (#233): rebuilt from the tagged tree and
  # attached to the release, so repo users get the exact artifact the tag
  # describes. The canonical public download stays site/placeroot.mcpb on
  # placeroot.dev; tests/test_mcpb_bundle.py keeps that copy in sync.
  mcpb:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          # v10 auto-disables cache on `release` when enable-cache is auto.
          # Keep true so uv still installs *and* the uv cache is used.
          enable-cache: true

      - name: Build and attach the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/build_mcpb.py dist/placeroot.mcpb
          gh release upload "${{ github.event.release.tag_name }}" dist/placeroot.mcpb --clobber
