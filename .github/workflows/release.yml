name: Release

on:
  release:
    types: [published]
  # Manual trigger: lets a maintainer re-run the publish without cutting a
  # new release (e.g. after a transient CI/infra failure). Trusted publishing
  # keys on repo + workflow filename + environment, not the event type, so a
  # dispatched run publishes the current pyproject version normally.
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no PyPI token in the repo
      contents: read   # checkout needs this to clone a PRIVATE repo — naming
                       # id-token alone drops every other scope (incl.
                       # contents) to none, which fails checkout on a private
                       # repo with "Repository not found".
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: if this version is already on PyPI (e.g. a re-run
          # after the npm job failed, or an infra retry), treat it as a
          # no-op success instead of erroring on the duplicate upload — so
          # the npm job below (needs: pypi) can still run.
          skip-existing: true

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pypi
    # Run whenever pypi didn't hard-fail — including when it was skipped or
    # a no-op — so npm can publish independently of a fresh PyPI upload.
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    permissions:
      contents: read   # checkout on a private repo
      id-token: write  # npm trusted publishing (OIDC) — no NPM_TOKEN, no 2FA
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; setup-node's Node 20 ships an
      # older npm. Upgrade, then publish — auth is via the OIDC token, so there
      # is no token to leak and no one-time-password prompt (which is what
      # blocked the automation-token path, EOTP).
      # NOTE: no --provenance. Sigstore provenance requires a PUBLIC source
      # repository ("Unsupported GitHub Actions source repository visibility:
      # private"); this repo is private, so provenance is impossible and the
      # flag hard-fails the publish. 0.3.0 shipped this same way, sans flag.
      # Requires a configured trusted publisher on npmjs.com for this repo +
      # workflow; see docs/PUBLISHING.md.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm (trusted publishing)
        working-directory: npm
        run: |
          # Idempotent, mirroring the PyPI job's skip-existing: publish only if
          # this version isn't already on npm, so a re-run of an already-shipped
          # version is a clean no-op instead of a "cannot publish over the
          # previously published version" failure.
          VERSION=$(node -p "require('./package.json').version")
          if npm view "placeroot@${VERSION}" version >/dev/null 2>&1; then
            echo "placeroot@${VERSION} is already on npm — nothing to publish."
          else
            npm publish --access public
          fi
