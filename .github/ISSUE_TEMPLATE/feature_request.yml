name: Feature request
description: An improvement to an existing tool or the server itself
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What can't you do today?
      description: The question you're trying to answer or the workflow that doesn't work.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to happen. If it changes a response shape, note that — agents parse our output, so shape changes are breaking.
    validations:
      required: true
