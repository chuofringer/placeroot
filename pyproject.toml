[project]
name = "placeroot"
version = "0.1.0"
description = "Ground AI agents in open map data. MCP server for Overture Maps — compact answers, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "overture-maps", "geospatial", "ai-agents", "openstreetmap", "duckdb"]
dependencies = [
    "duckdb>=1.5.5",
    "mcp[cli]>=2.0.0",
]

[project.scripts]
placeroot = "placeroot.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
# Only installed by the CI browser-smoke job (and locally via
# `uv sync --group browser`) — a real Chromium binary has no business in the
# offline `uv sync` / default `pytest` path. See scripts/browser_smoke.py.
browser = [
    "playwright>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placeroot"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: hits real Overture S3 data; excluded by default, run with -m live",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
