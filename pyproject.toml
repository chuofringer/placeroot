[project]
name = "placeroot"
version = "0.3.0"
description = "Ground AI agents in open map data. MCP server for Overture Maps — compact answers, no API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vibe Mapper", email = "chuo.fringer@gmail.com" }]
keywords = ["mcp", "overture-maps", "geospatial", "ai-agents", "openstreetmap", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "duckdb>=1.5.5",
    "mcp[cli]>=2.0.0",
]

# The GitHub repo (chuofringer/placeroot) is currently PRIVATE, so any link
# to it 404s for anyone landing on the public PyPI page. Point Issues/Docs at
# the public site instead; restore Repository/Issues -> GitHub once the repo
# goes public.
[project.urls]
Homepage = "https://placeroot.dev"
Issues = "https://placeroot.dev"
Documentation = "https://placeroot.dev/how-it-works.html"

[project.scripts]
placeroot = "placeroot.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
# Only installed by the CI browser-smoke job (and locally via
# `uv sync --group browser`) — a real Chromium binary has no business in the
# offline `uv sync` / default `pytest` path. See scripts/browser_smoke.py.
browser = [
    "playwright>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placeroot"]

# The sdist follows VCS-tracked files (so .claude/, .venv/, dist/ — all
# gitignored — are already excluded, keeping a local `uv build` identical to
# a clean CI checkout). Drop the couple of tracked dev-only files that add
# nothing for someone installing from source.
[tool.hatch.build.targets.sdist]
exclude = [
    ".gitignore",
    ".python-version",
    ".github",
    "npm",
    "scripts/browser_smoke.py",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: hits real Overture S3 data; excluded by default, run with -m live",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
